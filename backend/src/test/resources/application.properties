# Test Database Configuration (Isolated in-memory H2)
spring.datasource.url=jdbc:h2:mem:task_manager_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Session and cookie settings for tests
server.servlet.session.cookie.name=TASKFLOW_SESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# Actuator
management.endpoints.web.exposure.include=health
